serenity {
  project.name = "Prueba Tecnica QA - Ceiba (SauceDemo + Restful Booker)"
  take.screenshots = FOR_FAILURES
  restart.browser.for.each = example
  report.show.step.details = true
  logging = VERBOSE
  console.colors = true
  # Evita que la suite se caiga completa si un escenario falla: reporta todo
  reports.show.step.details = true
}

# ---------------------------------------------------------------------------
# WebDriver: Selenium Manager resuelve el driver automaticamente (sin descargas manuales)
# ---------------------------------------------------------------------------
webdriver {
  driver = chrome
  timeouts {
    implicitlywait = 0
    fluentwait = 10000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "--disable-dev-shm-usage",
        "--no-sandbox",
        "--disable-gpu",
        "--window-size=1920,1080",
        "--disable-search-engine-choice-screen",
        "--disable-notifications",
        "--incognito",
        "--remote-allow-origins=*"
      ]
      excludeSwitches = ["enable-automation"]
      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
        "profile.password_manager_leak_detection" = false
      }
    }
  }
}

# Esperas explicitas por defecto (PROHIBIDO Thread.sleep en este proyecto)
serenity.timeout = 10000
serenity.wait.for.timeout = 10000

environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com"
  }
  local {
    webdriver.base.url = "https://www.saucedemo.com"
  }
  ci {
    webdriver.base.url = "https://www.saucedemo.com"
    webdriver.capabilities."goog:chromeOptions".args = [
      "--headless=new",
      "--disable-dev-shm-usage",
      "--no-sandbox",
      "--disable-gpu",
      "--window-size=1920,1080",
      "--disable-search-engine-choice-screen",
      "--incognito",
      "--remote-allow-origins=*"
    ]
  }
}
